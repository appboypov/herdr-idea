name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v4
        with:
          path: .cache
          key: natives-${{ hashFiles('scripts/build-natives.sh') }}
      - name: Build libghostty-vt for all four platforms
        run: scripts/build-natives.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        run: ./gradlew --console=plain check buildPlugin
      - name: Check the zip carries every native library
        run: |
          jar=$(unzip -Z1 build/distributions/*.zip | grep -E '^herdr-idea/lib/herdr-idea-[^/]*[0-9]\.jar$')
          unzip -p build/distributions/*.zip "$jar" > /tmp/plugin.jar
          for lib in darwin-aarch64/libghostty-vt.dylib darwin-x86_64/libghostty-vt.dylib linux-x86_64/libghostty-vt.so linux-aarch64/libghostty-vt.so; do
            unzip -l /tmp/plugin.jar "native/$lib" > /dev/null || { echo "missing native/$lib"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: herdr-idea-plugin
          path: build/distributions/*.zip
