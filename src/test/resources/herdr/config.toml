onboarding = false
[ui]

agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.sidebar.spaces]
rows = [
  ["workspace"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["pane"],
]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+;"
resize_mode = ""
split_vertical = ["prefix+v", "cmd+e"]
split_horizontal = ["prefix+minus", "cmd+d"]
close_pane = "prefix+x"
new_tab = ["prefix+c", "cmd+t"]
rename_tab = ["prefix+shift+t", "cmd+r"]
rename_pane = ["prefix+shift+p", "ctrl+r"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]
new_workspace = ["prefix+shift+n", "cmd+n"]
close_workspace = ["prefix+shift+d", "cmd+shift+w"]
rename_workspace = ["prefix+shift+w", "cmd+shift+r"]
previous_workspace = "alt+up"
next_workspace = "alt+down"
previous_agent = "cmd+up"
next_agent = "cmd+down"
focus_pane_left = "prefix+h"
focus_pane_down = ["prefix+j", "ctrl+down"]
focus_pane_up = ["prefix+k", "ctrl+up"]
focus_pane_right = "prefix+l"
zoom = ["prefix+z", "cmd+backtick"]
goto = "cmd+shift+k"

[[keys.command]]
key = "cmd+w"
type = "shell"
command = "$HOME/.config/herdr/close-pane.sh"
description = "close pane, keep the space when it is the last one"

[[keys.command]]
key = "cmd+k"
type = "plugin_action"
command = "appboypov.search.open"
description = "search herdr"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "appboypov.search.open"
description = "search herdr"

[[keys.command]]
key = "ctrl+alt+k"
type = "plugin_action"
command = "appboypov.search.open"
description = "search herdr"

[[keys.command]]
key = "cmd+p"
type = "plugin_action"
command = "appboypov.quick-actions.open"
description = "quick actions"

[[keys.command]]
key = "alt+p"
type = "plugin_action"
command = "appboypov.quick-actions.open"
description = "quick actions"

[[keys.command]]
key = "ctrl+alt+p"
type = "plugin_action"
command = "appboypov.quick-actions.open"
description = "quick actions"

[[keys.command]]
key = "cmd+shift+c"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "cmd+shift+m"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "cmd+shift+x"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "cmd+shift+a"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "cmd+shift+o"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "cmd+shift+l"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's last reply"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[experimental]
kitty_graphics = true
